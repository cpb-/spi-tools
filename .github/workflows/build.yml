# SPDX-License-Identifier: GPL-2.0-only
name: Build and test
on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake cmake gcc make python3
      - name: Autotools debug build and regression tests
        run: |
          autoreconf -fi
          mkdir build-autotools
          cd build-autotools
          ../configure --enable-debug
          make -j2
          make check
          make distcheck
      - name: CMake build and regression tests
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          cmake --build build-cmake --parallel 2
          ctest --test-dir build-cmake --output-on-failure
          DESTDIR="$RUNNER_TEMP/spi-tools-stage" cmake --install build-cmake --prefix /opt/spi-tools
          test -x "$RUNNER_TEMP/spi-tools-stage/opt/spi-tools/bin/spi-pipe"
          test -f "$RUNNER_TEMP/spi-tools-stage/opt/spi-tools/share/man/man1/spi-pipe.1"
